<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>随机提示音</title>
<link rel="icon" type="image/png" href="%E9%9A%8F%E6%9C%BA%E6%8F%90%E7%A4%BA%E9%9F%B3logo.png" />
<link rel="apple-touch-icon" href="%E9%9A%8F%E6%9C%BA%E6%8F%90%E7%A4%BA%E9%9F%B3logo.png" />
<link rel="apple-touch-icon" sizes="180x180" href="%E9%9A%8F%E6%9C%BA%E6%8F%90%E7%A4%BA%E9%9F%B3logo.png" />
<style>
  :root{
    --bg-0:#0e0c0a; --bg-1:#17130f; --bg-2:#211a14;
    --surface:#241d16; --surface-2:#2d251c; --line:#3a3025;
    --text:#f1e6d2; --muted:#9a8d78; --faint:#6b6151;
    --accent:#e6a94d; --accent-soft:#e6a94d55; --ring-track:#2a2219;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(120% 90% at 50% 22%, var(--bg-2) 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:""; position:fixed; top:38%; left:50%;
    width:min(80vw,620px); height:min(80vw,620px); transform:translate(-50%,-50%);
    background:radial-gradient(circle, var(--accent) 0%, transparent 62%);
    opacity:.06; filter:blur(30px); pointer-events:none; transition:opacity .8s ease; z-index:0;
  }
  .gear{
    position:fixed; top:18px; right:20px; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); background:transparent; border:none; border-radius:50%;
    cursor:pointer; opacity:.3; transition:opacity .25s ease, transform .4s ease, color .25s ease; z-index:5;
  }
  .gear:hover{ opacity:.85; color:var(--text); transform:rotate(35deg); }
  .gear svg{ width:22px; height:22px; }

  .stage{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:30px; padding:24px; }
  .phase{
    font-size:38px; font-weight:700; letter-spacing:.01em; color:var(--accent);
    text-shadow:0 0 26px var(--accent-soft); transition:color .6s ease, text-shadow .6s ease; min-height:46px;
  }
  .clock{ position:relative; width:min(74vw, 320px); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .clock svg{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ring-track); stroke-width:6; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:7; stroke-linecap:round;
    filter:drop-shadow(0 0 8px var(--accent-soft)); transition:stroke .6s ease, stroke-dashoffset .3s linear; }
  .time{ position:relative; z-index:1; font-size:clamp(52px, 15vw, 78px); font-weight:300; letter-spacing:.02em;
    font-variant-numeric:tabular-nums; color:var(--text); font-feature-settings:"tnum" 1; }

  .controls{ display:flex; align-items:center; gap:26px; }
  .btn{ border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%;
    transition:transform .15s ease, box-shadow .3s ease, background .3s ease; }
  .btn:active{ transform:scale(.92); }
  .btn-main{ width:74px; height:74px; background:var(--accent); color:#241a08;
    box-shadow:0 0 0 1px #ffffff10, 0 8px 30px -6px var(--accent);
    transition:background .6s ease, box-shadow .6s ease, transform .15s ease; }
  .btn-main svg{ width:30px; height:30px; }
  .btn-main .icon-play{ margin-left:4px; }
  .btn-sub{ width:58px; height:58px; background:var(--surface-2); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); }
  .btn-sub:hover{ color:var(--text); background:var(--surface); }
  .btn-sub svg{ width:24px; height:24px; }

  .status{ position:fixed; left:0; right:0; bottom:26px; pointer-events:none; font-size:13px; letter-spacing:.06em; color:var(--faint); text-align:center; transition:color .3s ease; }
  .status.hint{ color:var(--accent); opacity:.85; }

  .overlay{ position:fixed; inset:0; background:rgba(6,5,4,.62);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:20; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .panel{ width:min(100%, 380px); max-height:88vh; overflow-y:auto;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg-1) 130%);
    border:1px solid var(--line); border-radius:22px; padding:24px 22px 18px;
    box-shadow:0 30px 80px -20px #000, 0 0 0 1px #ffffff08 inset;
    transform:translateY(14px) scale(.98); transition:transform .28s ease; }
  .overlay.open .panel{ transform:none; }
  .panel h2{ font-size:16px; font-weight:600; letter-spacing:.05em; color:var(--text); margin-bottom:18px; text-align:center; }
  .field{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid #ffffff08; }
  .field:last-of-type{ border-bottom:none; }
  .field label{ font-size:14px; color:var(--muted); flex:1; }
  .field .unit{ color:var(--faint); font-size:12px; margin-left:4px; }
  .range-row{ display:flex; align-items:center; gap:8px; }
  input[type=number]{ width:64px; background:var(--bg-0); border:1px solid var(--line); color:var(--text);
    font-size:15px; text-align:center; padding:7px 6px; border-radius:10px; font-variant-numeric:tabular-nums; }
  input[type=number]:focus{ outline:none; border-color:var(--accent); }
  .dash{ color:var(--faint); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:130px; height:4px; border-radius:3px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 8px var(--accent-soft); cursor:pointer; }
  .tests{ display:flex; gap:10px; margin-top:14px; }
  .test-link{ flex:1; text-align:center; font-size:13px; color:var(--muted); cursor:pointer;
    padding:8px; border-radius:10px; box-shadow:inset 0 0 0 1px var(--line); transition:color .2s ease, background .2s ease; }
  .test-link:hover{ color:var(--accent); background:var(--surface-2); }
  .panel-actions{ display:flex; gap:10px; margin-top:16px; }
  .pbtn{ flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; font-weight:600; letter-spacing:.05em; cursor:pointer;
    transition:filter .2s ease, background .2s ease; }
  .pbtn.ghost{ background:var(--surface-2); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); }
  .pbtn.ghost:hover{ color:var(--text); }
  .pbtn.solid{ background:var(--accent); color:#241a08; }
  .pbtn.solid:hover{ filter:brightness(1.06); }

  /* 设置里的「学习记录」入口 + 热力图(画法照 GitHub:周日起、一列一周、一整年 53 周) */
  .field-link{ width:100%; background:none; border:none; border-bottom:1px solid #ffffff08; cursor:pointer;
    font:inherit; font-size:14px; color:var(--muted); transition:color .2s ease; }
  .field-link:hover{ color:var(--text); }
  .field-link .chev{ font-size:18px; color:var(--faint); }
  .overlay.stats{ z-index:21; }
  .panel.stats-panel{ width:min(100%, 830px); }
  .stats-summary{ font-size:14px; color:var(--text); margin-bottom:14px; }
  /* 星期标签固定在左边不跟着滚;右边滚动区用 rtl,打开时天然停在最右(今天 + 未来),不靠 JS 算滚动位置 */
  .heat-wrap{ display:flex; gap:6px; --cell:11px; --gap:3px; }
  .heat-scroll{ flex:1; min-width:0; overflow-x:auto; padding-bottom:6px; direction:rtl; }
  .heat{ width:max-content; direction:ltr; }
  .heat-months{ position:relative; height:16px; font-size:11px; color:var(--muted); }
  .heat-months span{ position:absolute; top:0; white-space:nowrap; }
  .heat-days{ flex:none; margin-top:16px; display:grid; grid-template-rows:repeat(7, var(--cell)); gap:var(--gap); width:20px; font-size:10px; line-height:var(--cell); color:var(--muted); }
  .heat-under{ position:relative; height:16px; }
  .heat-today{ position:absolute; top:4px; transform:translateX(-50%); font-size:10px; line-height:1; color:var(--text); white-space:nowrap; }
  .heat-grid{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, var(--cell)); grid-auto-columns:var(--cell); gap:var(--gap); }
  .cell{ display:block; width:var(--cell); height:var(--cell); border-radius:2px; outline:1px solid #ffffff0d; outline-offset:-1px; background:var(--heat-0); }
  .cell.future{ background:none; outline:1px dashed #ffffff1a; }
  .cell.today{ outline:1.5px solid var(--text); outline-offset:1px; }
  .cell.l1{ background:var(--heat-1); } .cell.l2{ background:var(--heat-2); }
  .cell.l3{ background:var(--heat-3); } .cell.l4{ background:var(--heat-4); }
  .heat-grid .cell[data-tip]:hover{ outline:1px solid var(--text); }
  .heat-legend{ display:flex; align-items:center; justify-content:flex-end; gap:4px; margin-top:10px; font-size:11px; color:var(--muted); --cell:11px; }
  .heat-legend .cell{ margin:0 1px; }
  .stats-note{ margin-top:12px; font-size:12px; color:var(--faint); line-height:1.6; }
  .heat-tip{ position:fixed; z-index:30; pointer-events:none; padding:6px 10px; border-radius:8px; font-size:12px; white-space:nowrap;
    background:var(--bg-0); color:var(--text); box-shadow:inset 0 0 0 1px var(--line), 0 6px 20px -6px #000;
    opacity:0; transform:translate(-50%, -100%); transition:opacity .12s ease; }
  .heat-tip.show{ opacity:1; }
  /* 「云同步」那一行:邮箱太长就省略号截掉邮箱,标签和「已同步 / 待上传」不折行(完整邮箱点进去能看到) */
  #openCloud > span:first-child{ flex:none; white-space:nowrap; }
  .cloud-right{ display:flex; align-items:center; gap:4px; min-width:0; }
  .cloud-state{ display:flex; min-width:0; white-space:nowrap; font-size:12px; color:var(--faint); }
  .cloud-email{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .cloud-sync{ flex:none; white-space:pre; }
  .overlay.auth{ z-index:22; }
  .auth-hint{ font-size:13px; color:var(--muted); text-align:center; margin:-8px 0 12px; line-height:1.6; min-height:0; }
  .auth-field{ display:flex; flex-direction:column; gap:6px; padding:8px 0; }
  .auth-field label{ font-size:13px; color:var(--muted); }
  .tin{ width:100%; background:var(--bg-0); border:1px solid var(--line); color:var(--text); font-size:15px; padding:10px 12px; border-radius:10px; user-select:text; -webkit-user-select:text; }
  .tin:focus{ outline:none; border-color:var(--accent); }
  .auth-error{ min-height:18px; margin-top:6px; font-size:13px; color:#e08a6d; text-align:center; }
  .auth-links{ display:flex; justify-content:center; gap:18px; margin-top:12px; }
  .auth-links button{ background:none; border:none; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; }
  .auth-links button:hover{ color:var(--accent); }
  :root{ --heat-0:#2e251b; --heat-1:#5c4222; --heat-2:#8c6228; --heat-3:#be8a38; --heat-4:#e6a94d; }
</style>
</head>
<body>

  <button class="gear" id="gear" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <main class="stage">
    <div class="phase" id="phase">Focus</div>
    <div class="clock">
      <svg viewBox="0 0 240 240">
        <circle class="ring-track" cx="120" cy="120" r="110"/>
        <circle class="ring-fg" id="ringFg" cx="120" cy="120" r="110"/>
      </svg>
      <div class="time" id="time">40:00</div>
    </div>
    <div class="controls">
      <button class="btn btn-main" id="playBtn" aria-label="开始">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn btn-sub" id="resetBtn" aria-label="重置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v4h4"/>
        </svg>
      </button>
    </div>
    <div class="status" id="status"></div>
  </main>

  <div class="overlay" id="overlay">
    <div class="panel" role="dialog" aria-label="设置">
      <h2>设置</h2>
      <button type="button" class="field field-link" id="openStats"><span>学习记录</span><span class="chev">›</span></button>
      <button type="button" class="field field-link" id="openCloud"><span>云同步</span><span class="cloud-right"><span class="cloud-state" id="cloudState">未登录</span><span class="chev">›</span></span></button>
      <div class="field">
        <label>提示音间隔</label>
        <div class="range-row">
          <input type="number" id="minInterval" min="1" max="120" step="1"><span class="dash">–</span>
          <input type="number" id="maxInterval" min="1" max="120" step="1"><span class="unit">分</span>
        </div>
      </div>
      <div class="field">
        <label>专注时长</label>
        <div class="range-row"><input type="number" id="focusMin" min="1" max="180" step="1"><span class="unit">分</span></div>
      </div>
      <div class="field">
        <label>大休息</label>
        <div class="range-row"><input type="number" id="bigRestMin" min="0" max="120" step="1"><span class="unit">分</span></div>
      </div>
      <div class="field">
        <label>两响间隔<span class="unit">闭眼→睁眼</span></label>
        <div class="range-row"><input type="number" id="eyeSec" min="1" max="120" step="1"><span class="unit">秒</span></div>
      </div>
      <div class="field">
        <label>循环轮数<span class="unit">0=无限</span></label>
        <div class="range-row"><input type="number" id="rounds" min="0" max="99" step="1"></div>
      </div>
      <div class="field">
        <label>音量</label>
        <input type="range" id="volume" min="0" max="1" step="0.05">
      </div>
      <div class="tests">
        <span class="test-link" id="testCash">▷ 试听 点钞</span>
        <span class="test-link" id="testBell">▷ 试听 钟声</span>
      </div>
      <div class="panel-actions">
        <button class="pbtn ghost" id="closeSettings">关闭</button>
        <button class="pbtn solid" id="saveSettings">保存</button>
      </div>
    </div>
  </div>

  <div class="overlay auth" id="authOverlay">
    <div class="panel" role="dialog" aria-label="云同步">
      <h2 id="authTitle">登录</h2>
      <div class="auth-hint" id="authHint"></div>
      <div class="auth-field" id="authEmailField"><label for="authEmail">邮箱</label><input class="tin" id="authEmail" type="email" autocomplete="email" autocapitalize="off"></div>
      <div class="auth-field" id="authCodeField"><label for="authCode">验证码</label><input class="tin" id="authCode" inputmode="numeric" autocomplete="one-time-code"></div>
      <div class="auth-field" id="authPasswordField"><label for="authPassword" id="authPasswordLabel">密码</label><input class="tin" id="authPassword" type="password" autocomplete="current-password"></div>
      <div class="auth-error" id="authError"></div>
      <div class="panel-actions">
        <button class="pbtn ghost" id="closeAuth">关闭</button>
        <button class="pbtn solid" id="authSubmit">登录</button>
      </div>
      <div class="auth-links" id="authLinks"></div>
    </div>
  </div>

  <div class="overlay stats" id="statsOverlay">
    <div class="panel stats-panel" role="dialog" aria-label="学习记录">
      <h2>学习记录</h2>
      <div class="stats-summary" id="statsSummary"></div>
      <div class="heat-wrap">
        <div class="heat-days"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>
        <div class="heat-scroll" id="heatScroll">
          <div class="heat">
            <div class="heat-months" id="heatMonths"></div>
            <div class="heat-grid" id="heatGrid"></div>
            <div class="heat-under"><span class="heat-today" id="heatToday">今天</span></div>
          </div>
        </div>
      </div>
      <div class="heat-legend">少 <i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i> 多</div>
      <div class="stats-note">记专注时表在走的时间:中途暂停、重置、关掉 app,前面学的都算;暂停和休息的时间不算。按这一段结束那一刻的日期记。</div>
      <div class="panel-actions"><button class="pbtn ghost" id="closeStats">关闭</button></div>
    </div>
    <div class="heat-tip" id="heatTip"></div>
  </div>

<script>
"use strict";

  focusMin: 40,                     // 分 —— 专注时长(倒计时)

  rounds: 0,                        // 0 = 无限
  volume: 0.8,
};
const STORE_KEY = "randomChime.settings.v3";
const SLEEP_PAUSE_MS = 120000;      // Mac 真睡着 ≥2分钟(合盖) → 自动暂停;只是切到后台被节流不算

  catch(e){ return Object.assign({}, DEFAULTS); }
}

/* ---------------- session persistence + long-idle auto-reload ---------------- */
const SESSION_KEY = "randomChime.session.v1";
const SESSION_MAX_AGE_MS = 12*3600*1000;    // 存档超过12小时视为过期,不还原
let reloading = false, sessionSavedAt = 0;
function saveSession(){ sessionSavedAt = Date.now(); try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ st, autoPaused, savedAt: sessionSavedAt })); }catch(e){} }
function loadSession(){ try{ const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); return (s && s.st && (Date.now()-s.savedAt) < SESSION_MAX_AGE_MS) ? s : null; }catch(e){ return null; } }
function hardReload(){ if(reloading) return; reloading = true; saveSession(); location.reload(); }  // 整页刷新=全新音频引擎;进度已存,还原后不丢

/* ---------------- study log (热力图的数据:专注阶段表在走的时间) ---------------- */
// 记「专注阶段表在走的时间」(2026-11-10 起;之前只记走满的):暂停、重置、走完、打开 app 还原进度时,把这一段记一条;暂停和休息的时间不算。
// 单独存,不跟进度存档(12 小时过期)混。每段存一条 { id, at(这段结束那一刻的毫秒), min(分钟), up(已传到云端) };热力图按天汇总。id 同时是云端的幂等键。
const SESSIONS_KEY = "randomChime.sessions.v1";
const LEVEL_MIN = [1, 80, 120, 160];                   // 当天学习的分钟数 ≥ 这些值 → 色阶 1~4(按 40 分钟一次:1、2、3、4 次起)
function dayKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }   // 本地 0 点换天
function loadSessions(){
  try{ const a = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]"); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function saveSessions(){ try{ localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }catch(e){} }
let sessions = loadSessions();
function buildStudyLog(){                              // { "2026-10-19": { min: 共学习多少分钟 } }
  const log = {};
  for(const s of sessions){
    const k = dayKey(new Date(s.at)), d = log[k] || { min:0 };
    d.min = Math.round((d.min + s.min) * 10) / 10; log[k] = d;
  }
  return log;
}
let studyLog = buildStudyLog();
function newId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
// st.loggedMs = 本轮专注已经记到第几毫秒(跟着进度存档走):把它之后走过的记成一条,再挪到当前位置
function logFocus(at){
  if(st.phase !== "focus") return;
  const done = Math.min(st.totalMs, st.totalMs - st.remainingMs);   // 后台被拖过头时 remainingMs 是负的,封顶到整轮
  const min = Math.round((done - (st.loggedMs || 0)) / 6000) / 10;  // 旧存档没有 loggedMs = 本轮一点没记过
  if(min <= 0) return;                                 // 不到 3 秒先不记(四舍五入是 0,云端也不收 0 分钟),留给下一段
  st.loggedMs = done;
  sessions.push({ id: newId(), at, min, up: false });
  studyLog = buildStudyLog(); saveSessions(); saveSession();   // 记录和「记到哪」一起存,刷新不会重记
  requestSync();                                       // 登录了就立刻传云端;没登录 / 没网先留在本机,以后补传
}

/* ---------------- cloud (Supabase:只存学习记录;没登录照常用,数据只在本机) ---------------- */
const SUPABASE_URL = "https://yzhfgwvufgiyyzbknadi.supabase.co";
const SUPABASE_KEY = "sb_publishable_bnZBUgm-QxtFLtDg33fKyg_riJSVwVo";      // publishable key 本来就是给网页用的;安全靠数据库的行级权限(RLS)
const SDK_URL = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js";
// 全页面唯一碰网络的地方;测试把假云端放进 window.randomChimeCloud。出错一律抛带 code 的 Error,code==="offline" 表示请求没到 Supabase
const cloud = window.randomChimeCloud || supabaseCloud();
function supabaseCloud(){
  let client = null, loading = null;
  const iso = ms => new Date(ms).toISOString();
  const toUser = u => ({ id: u.id, email: u.email });
  function cloudError(e){
    const err = new Error(e.message || String(e));
    const offline = e.name === "AuthRetryableFetchError" || /fetch|load failed|network|not loaded/i.test(err.message);   // Chrome:Failed to fetch;Safari:Load failed
    err.code = offline ? "offline" : (e.code || e.name);
    return err;
  }
  function loadSdk(){                                  // 用到才加载,没登录的人首页不多一个请求
    if(window.supabase) return Promise.resolve();
    return loading || (loading = new Promise((ok, no) => {
      const sc = document.createElement("script"); sc.src = SDK_URL; sc.onload = ok;
      sc.onerror = () => { loading = null; no(new Error("sdk not loaded")); };
      document.head.appendChild(sc);
    }));
  }
  async function run(fn){                              // Supabase 出错不抛异常、返回 { data, error },这里统一转成抛出
    let res;
    try{
      await loadSdk();
      if(!client) client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { detectSessionInUrl: false } });
      res = await fn(client);
    }catch(e){ throw cloudError(e); }
    if(res.error) throw cloudError(res.error);
    return res.data;
  }
  return {
    async currentUser(){ const { session } = await run(c => c.auth.getSession()); return session ? toUser(session.user) : null; },
    async signUp(email, password){
      const { user } = await run(c => c.auth.signUp({ email, password }));
      if(user && user.identities && !user.identities.length) throw Object.assign(new Error("user already exists"), { code: "user_already_exists" });   // 已注册的邮箱:不报错、不发信,只返回空 identities
    },
    resendSignupCode: email => run(c => c.auth.resend({ type: "signup", email })),
    verifySignupCode: async (email, token) => toUser((await run(c => c.auth.verifyOtp({ email, token, type: "email" }))).user),
    signIn: async (email, password) => toUser((await run(c => c.auth.signInWithPassword({ email, password }))).user),
    sendResetCode: email => run(c => c.auth.resetPasswordForEmail(email)),
    verifyResetCode: async (email, token) => toUser((await run(c => c.auth.verifyOtp({ email, token, type: "recovery" }))).user),
    setPassword: password => run(c => c.auth.updateUser({ password })),
    signOut: () => run(c => c.auth.signOut()),
    async pullSessions(){                              // 一次最多回 1000 条,分页拉完
      const out = [];
      for(let from = 0; ; from += 1000){
        const rows = await run(c => c.from("focus_sessions").select("client_id, ended_at, minutes").order("ended_at").range(from, from + 999));
        rows.forEach(r => out.push({ clientId: r.client_id, endedAt: Date.parse(r.ended_at), minutes: Number(r.minutes) }));
        if(rows.length < 1000) return out;
      }
    },
    async appendSession(x){
      try{ await run(c => c.from("focus_sessions").insert({ client_id: x.clientId, ended_at: iso(x.endedAt), minutes: x.minutes })); }
      catch(e){ if(e.code !== "23505") throw e; }      // 23505 = 云端已经有这条(上次传了但没收到回复),当成功
    },
  };
}

/* ---------------- sync (本机 sessions ⇄ 云端 focus_sessions;只追加,按 id 去重) ---------------- */
let cloudUser = null, syncing = false, syncAgain = false, syncFailed = null;
function mayBeSignedIn(){                              // 从没登录过的人不去加载 SDK
  if(window.randomChimeCloud) return true;
  try{ return Object.keys(localStorage).some(k => k.startsWith("sb-")); }catch(e){ return false; }
}
async function requestSync(){
  if(!cloudUser && !mayBeSignedIn()){ renderCloudState(); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  try{
    do{
      syncAgain = false;
      if(!cloudUser) cloudUser = await cloud.currentUser();
      if(!cloudUser) break;
      for(const s of sessions.filter(x => !x.up)){
        await cloud.appendSession({ clientId: s.id, endedAt: s.at, minutes: s.min });
        s.up = true; saveSessions();
      }
      const have = new Map(sessions.map(x => [x.id, x])); let changed = false;
      for(const r of await cloud.pullSessions()){
        const mine = have.get(r.clientId);
        if(!mine){ sessions.push({ id: r.clientId, at: r.endedAt, min: r.minutes, up: true }); changed = true; }
        else if(!mine.up){ mine.up = true; changed = true; }
      }
      if(changed){ studyLog = buildStudyLog(); saveSessions(); if(el.stats.classList.contains("open")) renderHeatmap(); }
      syncFailed = null;
    }while(syncAgain);
  }catch(e){ syncFailed = e; }
  finally{ syncing = false; renderCloudState(); }
}
function renderCloudState(){
  const box = $("cloudState"); if(!box) return;
  const pending = sessions.filter(x => !x.up).length;
  if(!cloudUser){ box.textContent = syncFailed && syncFailed.code === "offline" ? "没连上网络" : "未登录"; return; }
  const email = document.createElement("span"), sync = document.createElement("span");
  email.className = "cloud-email"; email.textContent = cloudUser.email;
  sync.className = "cloud-sync"; sync.textContent = " · " + (pending ? "待上传 " + pending + " 条" : "已同步");
  box.replaceChildren(email, sync);
}

const ACCENTS = {
  focus:{ c:"#e6a94d", soft:"#e6a94d55" },
  break:{ c:"#c98a58", soft:"#c98a5844" },
  done: { c:"#cbb26a", soft:"#cbb26a44" },
};

/* ---------------- dom ---------------- */
const $ = id => document.getElementById(id);
const el = { phase:$("phase"), time:$("time"), ring:$("ringFg"), status:$("status"),
  play:$("playBtn"), reset:$("resetBtn"), gear:$("gear"), overlay:$("overlay"), stats:$("statsOverlay") };
const RING_C = 2 * Math.PI * 110;
el.ring.style.strokeDasharray = RING_C;

/* ---------------- audio (只在响的一瞬发声;计时中另有一路听不见的保活信号) ---------------- */
let audioCtx=null, master=null, cashBuf=null, bellBuf=null;
let armed = [];                               // 提前排进音频时钟、还没响的声音 {s, at};暂停/重置时取消
let keepAlive = null;                         // 计时中一直输出的极小信号:Safari 会冻结「看不见又没在出声」的网页,冻结后排好的声音全哑
let mayBeFrozen = false;                      // 不计时时窗口藏过 → 网页可能被冻过;下次点开始/试听换新引擎(保险,见 ensureLiveAudio)
// 系统音频输出(WebKit 的 GPU 进程里那条 RemoteAudioDestination)开着的时候网页被冻结 ≥2 秒,那条输出就永久哑掉:
// 输出照常往前读,网页那边冻住没写;恢复后网页一口气补写,写的位置甩开读的位置超过 2 秒缓冲,读的那头再也读不到数据(只出静音)。
// 同一采样率的引擎全进程共用一条输出,换新引擎、刷新页面都还用它,只有退出 app 才换(2026-11-10 日志 + WebKit 源码)。所以:
//  ① 不计时就 suspend 引擎,让输出关着(关着时被冻结没事);② 万一输出开着时可能被冻过,换个采样率逼出一条新输出。
let outputOn = false;                         // 输出可能开着:新引擎 / resume 之后为 true,suspend 生效后才 false
let audioGen = 0;                             // 每次唤醒 +1:晚到的 suspend 回调别把刚唤醒的输出记成关着
let riskSince = 0;                            // 「输出开着 + 看不见 + 没保活」从哪一刻开始(performance.now),0 = 不在这种状态
let zombieRisk = false;                       // 上面这种状态持续过 RISK_MS:那条输出可能已坏,下次点开始/试听换采样率
let soundEndsAt = 0;                          // 当前引擎上已经开始响的声音最晚几点响完(音频时钟);关输出要等它放完,不掐断
let quietTimer = null;
const RISK_MS = 5000;                         // Safari 最快也要藏 10 秒、静 10 秒才冻结,5 秒内关掉输出就不会出事
const QUIET_PAD_MS = 300;
const RATE_KEY = "randomChime.audioRate.v1";  // 换过几次输出(0 = 用默认采样率);存起来是因为刷新页面后输出还是那条
let audioRateSeq = 0;
try{ audioRateSeq = parseInt(localStorage.getItem(RATE_KEY), 10) || 0; }catch(e){}
let audioTouchedAt = 0;                       // 最近一次「引擎确实活着」的时刻(建 ctx 或成功发声);用于判断是否需换新引擎
const REBUILD_IDLE_MS = 120000;              // 空闲≥2分钟再点开始 → 先重建全新音频引擎(旧引擎可能已被系统拆掉,且 state 会撒谎报 running)
function b64ToArrayBuffer(b64){
  const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function buildAudio(){                        // 造一个全新引擎(在用户手势内调用即可立刻发声)
  const AC = window.AudioContext || window.webkitAudioContext;
  const rate = audioRateSeq ? 44100 + 10 * (1 + (audioRateSeq - 1) % 390) : 0;   // 44110、44120…:每个采样率是一条新输出
  try{ audioCtx = rate ? new AC({ sampleRate: rate }) : new AC(); }catch(e){ audioCtx = new AC(); }
  master = audioCtx.createGain(); master.gain.value = cfg.volume; master.connect(audioCtx.destination);
  audioTouchedAt = Date.now(); mayBeFrozen = false;
  zombieRisk = false; riskSince = 0; outputOn = true; soundEndsAt = 0; audioGen++; checkRisk();
  // 挂起状态即可解码,提前备好缓冲,首次点击就能立刻响
  audioCtx.decodeAudioData(b64ToArrayBuffer(CASH_B64), b=>{ cashBuf=b; }, ()=>{});
  audioCtx.decodeAudioData(b64ToArrayBuffer(BELL_B64), b=>{ bellBuf=b; }, ()=>{});
}
function initAudio(){ if(audioCtx) return; buildAudio(); }
function rebuildAudio(){                       // 换新引擎:先 close 旧的(避开 Safari 每页 ~4 个 context 上限),再造新的
  const old = audioCtx;
  audioCtx = null;
  try{ if(old) old.close(); }catch(e){}
  buildAudio();
  // 旧的已解码 cashBuf/bellBuf 仍保留引用,AudioBuffer 可跨 context 使用 → 新引擎当场就能响;
  // buildAudio 里新引擎重新解码回来后会自动替换,供后续响铃用。
}
function ensureLiveAudio(){                    // 点开始/试听时(手势内)调用:旧引擎可能已哑就换新的;计时中不换,免得丢掉排好的声音
  if(st.running) return;
  checkRisk();
  if(zombieRisk){ audioRateSeq++; try{ localStorage.setItem(RATE_KEY, String(audioRateSeq)); }catch(e){} }   // 输出可能已坏:换采样率 = 换一条新输出
  if(!audioCtx || mayBeFrozen || zombieRisk || Date.now() - audioTouchedAt >= REBUILD_IDLE_MS) rebuildAudio();
}
function wakeAudio(){                          // 打开输出(resume);只在点开始 / 试听 / 计时中调用
  outputOn = true; audioGen++; checkRisk();
  return Promise.resolve(audioCtx.resume());
}
function quietAudio(){                         // 不计时:等正在响的那声放完,就 suspend 引擎 → 输出关掉;WebKit 不会自己再打开被页面 suspend 的引擎
  clearTimeout(quietTimer); quietTimer = null;
  if(st.running || !audioCtx) return;
  const wait = Math.max(0, soundEndsAt - audioCtx.currentTime);
  quietTimer = setTimeout(() => {
    quietTimer = null;
    const ctx = audioCtx, gen = audioGen;
    if(st.running || !ctx || ctx.state === "closed") return;
    if(soundEndsAt - ctx.currentTime > 0.05){ quietAudio(); return; }   // 这期间又响了一声(连点试听)
    Promise.resolve(ctx.suspend()).then(() => {
      if(ctx === audioCtx && gen === audioGen && !st.running){ outputOn = false; checkRisk(); }
    }).catch(()=>{});
  }, wait * 1000 + QUIET_PAD_MS);
}
function checkRisk(){                          // 在每个可能改变「输出开着 / 看不见 / 保活」的时刻调用
  const now = performance.now(), risky = outputOn && document.hidden && !keepAlive;
  if(riskSince && now - riskSince >= RISK_MS) zombieRisk = true;      // 网页被冻住时这里不跑;恢复后第一次调用就补上
  riskSince = risky ? (riskSince || now) : 0;
}
function unlockAudio(){ initAudio(); if(audioCtx.state !== "running"){ wakeAudio().catch(()=>{}); } }
function playBuf(buf, delaySec){
  if(!audioCtx || !buf) return;
  const doPlay = () => {
    if(!audioCtx || audioCtx.state !== "running" || !buf) return;
    if(delaySec > 0 && !st.running) return;                          // 等 resume 期间已被暂停 → 不再排
    master.gain.value = cfg.volume;
    const s = audioCtx.createBufferSource(); s.buffer = buf; s.connect(master);
    const at = audioCtx.currentTime + (delaySec > 0 ? delaySec : 0);
    s.start(at);                                                     // 由音频线程精确排期,不靠主线程 tick
    const end = at + (buf.duration || 0);
    if(delaySec > 0) armed.push({ s, at, end });
    else soundEndsAt = Math.max(soundEndsAt, end);
    audioTouchedAt = Date.now();                                     // 真正发过声 → 刷新「引擎活着」时刻
    if(!st.running) quietAudio();                                    // 试听:响完就关输出
  };
  if(audioCtx.state === "running"){ doPlay(); }
  else { wakeAudio().then(doPlay).catch(()=>{}); }
}
function disarmSounds(){                       // 取消还没响的(正在响的那声不打断),停掉保活;不在计时就关输出
  const now = audioCtx ? audioCtx.currentTime : 0;
  armed.forEach(a => { if(a.at > now){ try{ a.s.stop(); }catch(e){} } else soundEndsAt = Math.max(soundEndsAt, a.end); });
  armed = [];
  stopKeepAlive();
  quietAudio();
}
function startKeepAlive(){                     // -80 dB 的直流,人耳听不见;但不是 0,WebKit 就认定页面在出声、不冻结它
  if(keepAlive || !audioCtx) return;
  try{
    keepAlive = audioCtx.createConstantSource();
    keepAlive.offset.value = 1e-4;
    keepAlive.connect(audioCtx.destination);   // 不经过音量(master):音量调到 0 也照样保活
    keepAlive.start();
  }catch(e){ keepAlive = null; }
  checkRisk();
}
function stopKeepAlive(){ if(keepAlive){ try{ keepAlive.stop(); }catch(e){} keepAlive = null; } noteHidden(); checkRisk(); }
function noteHidden(){ if(document.hidden && !keepAlive) mayBeFrozen = true; }   // 看不见又没保活 → 连续藏满 8 分钟 Safari 就冻结网页;保守起见藏过就算
function playCash(){ playBuf(cashBuf); }
function playBell(){ playBuf(bellBuf); }
function playPair(delaySec){
  playBuf(cashBuf, delaySec);                 // 闭眼
  playBuf(cashBuf, delaySec + cfg.eyeSec);    // 睁眼:音频线程精确 eyeSec 秒后,不受后台标签页节流影响
}

/* ---------------- state ---------------- */
let st = freshState();
let ticker = null;
let autoPaused = false;
let lastMono = 0;                     // 上次 tick 的 performance.now(),配合 st.lastTick 判断是否真睡过

function freshState(){
  const s = {
    phase:"focus", running:false, begun:false,
    totalMs: cfg.focusMin*60000, remainingMs: cfg.focusMin*60000,
    rings:[], lastTick:0, loggedMs:0,
  };
  s.rings = planRings(s.totalMs, 0);
  return s;
}
function randIntervalMs(){
  const lo = Math.min(cfg.minInterval, cfg.maxInterval), hi = Math.max(cfg.minInterval, cfg.maxInterval);
  return (lo + Math.random()*(hi-lo)) * 60000;
}
// 一次排好本轮专注每组第一响的时刻(距本轮开始 ms):每组从上一组睁眼起算随机间隔,整组须落在专注结束前
function planRings(totalMs, fromElapsed){
  const rings = [];
  for(let t = fromElapsed + randIntervalMs(); t + cfg.eyeSec*1000 <= totalMs; t += cfg.eyeSec*1000 + randIntervalMs()) rings.push(t);
  return rings;
}

/* ---------------- 提前排声音 ---------------- */
// 本阶段接下来要响的声音一次性排进音频时钟:后台主线程被拖住几分钟,也照样准时响
function armPhase(){
  startKeepAlive();                                                  // 有声音排着就一直保持出声,窗口藏起来也不会被 Safari 冻结
  if(st.phase === "break"){ if(st.remainingMs >= 0 && !isLastRound()) playBuf(cashBuf, st.remainingMs/1000); return; }   // 大休息结束:点钞
  if(st.phase !== "focus") return;
  const elapsed = st.totalMs - st.remainingMs;
  const left = st.remainingMs/1000, restEnd = left + Math.max(0, cfg.bigRestMin)*60;   // 已过去的时刻不补(被拖住很久时不一下子补响一串)
  st.rings.forEach(t => { if(t >= elapsed) playPair((t - elapsed)/1000); });
  if(left >= 0) playBuf(bellBuf, left);                              // 专注结束:钟声
  if(restEnd >= 0 && !isLastRound()) playBuf(cashBuf, restEnd);      // 大休息结束 → 下一轮开始:点钞
}

/* ---------------- timing loop ---------------- */
function tick(){
  if(!st.running) return;
  const now = Date.now(), mono = performance.now(), delta = now - st.lastTick;
  const slept = delta - (mono - lastMono);            // macOS 上 performance.now 睡眠时不走、Date 照走 → 差值=睡了多久
  st.lastTick = now; lastMono = mono;
  if(slept >= SLEEP_PAUSE_MS){ pause(true); return; } // 合盖睡眠 → 自动暂停,不吞时间;后台被节流(两个钟一起走)照常计时

  st.remainingMs -= delta;

  if(st.phase === "focus"){
    if(st.remainingMs <= 0) enterBreak();             // 每组响铃已在本轮开始时排进音频时钟,这里只管走表
  }else if(st.phase === "break"){
    if(st.remainingMs <= 0) endBreak();
  }
  if(now - sessionSavedAt >= 60000) saveSession();    // 计时中每分钟存一次:页面卡死、来不及存,重开也最多丢最后 1 分钟的学习记录
  render();
}

/* ---------------- phase transitions ---------------- */
// tick 晚到(后台被拖住)时多走的时间算进下一阶段,倒计时才跟已排好的声音对得上
function enterBreak(){                                 // 结束钟声已在本轮开始时排进音频时钟(armPhase)
  logFocus(Date.now() + st.remainingMs);              // 按真正走完的那一刻记日期(tick 晚到也不记错天)
  if(cfg.bigRestMin <= 0){ endBreak(); return; }
  const over = Math.max(0, -st.remainingMs);
  st.phase = "break"; st.totalMs = cfg.bigRestMin*60000; st.remainingMs = st.totalMs - over;
  applyAccent(); saveSession();
}
function isLastRound(){ return cfg.rounds !== 0 && (st._round||1) >= cfg.rounds; }
function endBreak(){
  if(isLastRound()){
    st.phase = "done"; st.running = false; stopTicker(); disarmSounds(); applyAccent(); render(); saveSession(); return;
  }
  const over = Math.max(0, -st.remainingMs);
  st._round = (st._round||1) + 1;
  st.phase = "focus"; st.totalMs = cfg.focusMin*60000; st.remainingMs = st.totalMs - over; st.loggedMs = 0;
  st.rings = planRings(st.totalMs, 0); applyAccent();
  armPhase(); saveSession();                           // 开头的点钞已在上一轮开始时排好;这里排新一轮的
}

/* ---------------- controls ---------------- */
function start(){
  const now = Date.now();
  ensureLiveAudio();                                    // 可能被冻过 / 空闲≥2分钟:在点击手势内直接换新引擎 → 一定能出声(不信任 state)
  unlockAudio();                                        // 新 ctx / 短暂空闲的旧 ctx 在此 resume
  if(audioCtx && audioCtx.state !== "running"){         // 最终兜底:连新引擎都唤不醒 = 真·设备死 → 整页刷新(进度已存,再点一次即出声)
    setTimeout(() => {
      if(!audioCtx || audioCtx.state === "running") return;
      wakeAudio().catch(()=>{});
      setTimeout(() => { if(audioCtx && audioCtx.state !== "running") hardReload(); }, 600);
    }, 600);
  }
  if(st.phase === "done") st = freshState();
  if(!st.begun){ st.begun = true; st._round = 1; }
  playCash();                                          // 首次开始 & 每次恢复都点钞(证明引擎活着/已继续)
  st.running = true; autoPaused = false; st.lastTick = now; lastMono = performance.now();
  armPhase(); startTicker(); render(); saveSession();
}
function pause(auto){ st.running = false; autoPaused = !!auto; stopTicker(); disarmSounds(); logFocus(Date.now()); render(); saveSession(); }
function toggle(){ st.running ? pause(false) : start(); }
function reset(){ st.running = false; autoPaused = false; stopTicker(); disarmSounds(); logFocus(Date.now()); st = freshState(); applyAccent(); render(); saveSession(); }
function startTicker(){ if(!ticker) ticker = setInterval(tick, 250); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }

/* ---------------- render ---------------- */
const TITLE = { focus:"Focus", break:"Break", done:"Done" };
function fmt(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function render(){
  el.phase.textContent = TITLE[st.phase] || "Focus";
  el.time.textContent = fmt(st.remainingMs);
  const total = st.totalMs || 1, frac = Math.max(0, Math.min(1, st.remainingMs/total));
  el.ring.style.strokeDashoffset = RING_C * (1 - frac);

  if(autoPaused){ el.status.className = "status hint"; el.status.textContent = "已自动暂停 · 点按继续"; }
  else{ el.status.className = "status"; el.status.textContent = ""; }

  el.play.innerHTML = st.running
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
    : '<svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function applyAccent(){
  const a = ACCENTS[st.phase] || ACCENTS.focus;
  document.documentElement.style.setProperty("--accent", a.c);
  document.documentElement.style.setProperty("--accent-soft", a.soft);
}

/* ---------------- settings ui ---------------- */
const sEl = { minInterval:$("minInterval"), maxInterval:$("maxInterval"), focusMin:$("focusMin"),
  bigRestMin:$("bigRestMin"), eyeSec:$("eyeSec"), rounds:$("rounds"), volume:$("volume") };
function fillSettings(){
  sEl.minInterval.value=cfg.minInterval; sEl.maxInterval.value=cfg.maxInterval;
  sEl.focusMin.value=cfg.focusMin; sEl.bigRestMin.value=cfg.bigRestMin;
  sEl.eyeSec.value=cfg.eyeSec; sEl.rounds.value=cfg.rounds; sEl.volume.value=cfg.volume;
}
function openSettings(){ fillSettings(); el.overlay.classList.add("open"); }
function closeSettings(){ el.overlay.classList.remove("open"); }
function readSettings(){
  const num=(v,d,lo,hi)=>{ let n=parseFloat(v); if(!isFinite(n)) n=d; return Math.min(hi,Math.max(lo,n)); };
  let lo=num(sEl.minInterval.value,3,0.1,120), hi=num(sEl.maxInterval.value,5,0.1,120);
  if(hi<lo){ const t=lo; lo=hi; hi=t; }
  cfg.minInterval=lo; cfg.maxInterval=hi;
  cfg.focusMin=num(sEl.focusMin.value,40,1,180);
  cfg.bigRestMin=num(sEl.bigRestMin.value,10,0,120);
  cfg.eyeSec=num(sEl.eyeSec.value,7,1,120);
  cfg.rounds=Math.round(num(sEl.rounds.value,0,0,99));
  cfg.volume=num(sEl.volume.value,0.8,0,1);
  saveCfg();
  if(master) master.gain.value=cfg.volume;
  if(!st.running){ st=freshState(); applyAccent(); }
  else { disarmSounds(); armPhase(); }                 // 计时中改设置:按新设置重排还没响的声音
  render();
}

/* ---------------- study heatmap ui ---------------- */
const WEEKS = 53, CELL_PITCH = 14, CELL_GAP = 3;      // 过去一整年 53 列(最后一列含今天);格子 11px + 间隔 3px
function fmtMin(m){ const t = Math.round(m); if(t < 1) return "不到 1 分钟"; return t < 60 ? t + " 分钟" : Math.floor(t/60) + " 小时" + (t%60 ? " " + t%60 + " 分钟" : ""); }
function levelOf(min){ return LEVEL_MIN.reduce((l, t, i) => min >= t ? i + 1 : l, 0); }
// 可见宽度能放几列,右边 1/5 画未来:打开(停在最右)时左 4/5 是过去,今天那一列卡在 4/5 处(Eric 定的比例)
function futureWeeks(){
  const cols = Math.floor(($("heatScroll").clientWidth + CELL_GAP) / CELL_PITCH);
  return Math.max(1, Math.round(cols / 5));
}
let heatFuture = 0;
function renderHeatmap(){
  const today = new Date(), todayKey = dayKey(today);
  const y = today.getFullYear(), m = today.getMonth(), d0 = today.getDate() - today.getDay() - (WEEKS-1)*7;   // 53 周前那个周日
  heatFuture = futureWeeks();
  const cols = WEEKS + heatFuture;
  let cells = "", labels = [], prevMonth = -1, sumMin = 0;
  for(let w = 0; w < cols; w++){
    const mon = new Date(y, m, d0 + w*7).getMonth();
    if(mon !== prevMonth) labels.push({ w, text: (mon+1) + "月" });
    prevMonth = mon;
    for(let i = 0; i < 7; i++){
      const day = new Date(y, m, d0 + w*7 + i), k = dayKey(day);
      if(k > todayKey){ cells += '<i class="cell future" data-date="' + k + '" data-future="1"></i>'; continue; }   // 未来:空格子,不算数、没提示
      const rec = studyLog[k], min = rec ? rec.min : 0, lv = levelOf(min), isToday = k === todayKey;
      sumMin += min;
      const tip = (isToday ? "今天 · " : "") + (day.getMonth()+1) + "月" + day.getDate() + "日 · " + (min ? "学习 " + fmtMin(min) : "没有学习记录");
      cells += '<i class="cell l' + lv + (isToday ? ' today" aria-current="date' : '') + '" data-date="' + k + '" data-level="' + lv + '" data-minutes="' + min + '" data-tip="' + tip + '"></i>';
    }
  }
  labels = labels.filter((l, i) => (i === labels.length-1 || labels[i+1].w - l.w >= 3) && l.w <= cols - 2);   // 太挤的、贴着最右边会撑出空白的月份标签丢掉
  $("heatGrid").innerHTML = cells;
  $("heatMonths").innerHTML = labels.map(l => '<span style="left:' + l.w*CELL_PITCH + 'px">' + l.text + '</span>').join("");
  $("heatToday").style.left = ((WEEKS-1)*CELL_PITCH + (CELL_PITCH-CELL_GAP)/2) + "px";
  $("statsSummary").textContent = sumMin ? "过去一年共学习 " + fmtMin(sumMin) : "过去一年还没有学习记录";
}
function openStats(){ requestSync(); renderHeatmap(); el.stats.classList.add("open"); $("heatScroll").scrollLeft = 0; }   // rtl 滚动区里 0 = 最右边(今天 + 未来)
function closeStats(){ el.stats.classList.remove("open"); hideTip(); }
function showTip(cellEl){
  const tip = $("heatTip"), r = cellEl.getBoundingClientRect();
  tip.textContent = cellEl.dataset.tip;
  tip.style.left = (r.left + r.width/2) + "px"; tip.style.top = (r.top - 6) + "px"; tip.classList.add("show");
}
function hideTip(){ $("heatTip").classList.remove("show"); }

/* ---------------- cloud sign-in ui (邮箱 + 密码;注册 / 重置密码用邮件里的验证码,不用链接) ---------------- */
const AUTH_VIEWS = {
  signin:  { title:"登录",     submit:"登录",     fields:["email","password"], links:[["signup","没有账号?注册"], ["forgot","忘记密码"]] },
  signup:  { title:"注册",     submit:"注册",     fields:["email","password"], links:[["signin","已有账号?登录"]] },
  verify:  { title:"输入验证码", submit:"确认",     fields:["code"],             links:[["resend","重发验证码"]] },
  forgot:  { title:"忘记密码",   submit:"发验证码", fields:["email"],            links:[["signin","回到登录"]] },
  reset:   { title:"重置密码",   submit:"改密码",   fields:["code","password"],  links:[["forgot","重发验证码"]] },
  account: { title:"云同步",     submit:"退出登录", fields:[],                   links:[] },
};
const AUTH_ERRORS = {
  invalid_credentials: "邮箱或密码不对", user_already_exists: "这个邮箱已经注册过了,直接登录",
  weak_password: "密码至少 6 位", otp_expired: "验证码不对或已过期", offline: "没连上网络,稍后再试",
  over_email_send_rate_limit: "发得太频繁,等一分钟再试", over_request_rate_limit: "试得太频繁,等一分钟再试",
};
let authView = "signin", resetVerified = false;          // 重置验证码只能用一次:密码没改成功时别再验一遍
function showAuthView(view, hint = ""){
  if(view === "resend"){ resendCode(); return; }
  authView = view;
  const v = AUTH_VIEWS[view];
  $("authTitle").textContent = v.title; $("authSubmit").textContent = v.submit;
  $("authHint").textContent = view === "account" ? cloudUser.email : hint; $("authError").textContent = "";
  for(const f of ["email","code","password"]) $("auth" + f[0].toUpperCase() + f.slice(1) + "Field").style.display = v.fields.includes(f) ? "" : "none";
  const fresh = view === "signup" || view === "reset";
  $("authPasswordLabel").textContent = fresh ? "新密码(至少 6 位)" : "密码";
  $("authPassword").autocomplete = fresh ? "new-password" : "current-password";
  $("authCode").value = ""; if(view === "reset") resetVerified = false;
  $("authLinks").innerHTML = "";
  v.links.forEach(([target, text]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = text; b.dataset.authView = target;
    b.addEventListener("click", () => showAuthView(target)); $("authLinks").appendChild(b);
  });
}
function openAuth(){ showAuthView(cloudUser ? "account" : "signin"); $("authOverlay").classList.add("open"); }
function closeAuth(){ $("authOverlay").classList.remove("open"); }
function authErrorText(e){ return AUTH_ERRORS[e.code] || "出错了:" + e.message; }
async function submitAuth(){
  const email = $("authEmail").value.trim(), password = $("authPassword").value, code = $("authCode").value.trim(), btn = $("authSubmit");
  $("authError").textContent = ""; btn.disabled = true;
  try{
    if(authView === "signin") onSignedIn(await cloud.signIn(email, password));
    else if(authView === "signup"){ await cloud.signUp(email, password); showAuthView("verify", "验证码已发到 " + email + ",1 小时内有效"); }
    else if(authView === "verify") onSignedIn(await cloud.verifySignupCode(email, code));
    else if(authView === "forgot"){ await cloud.sendResetCode(email); showAuthView("reset", "验证码已发到 " + email); }
    else if(authView === "reset"){
      if(password.length < 6) throw Object.assign(new Error(), { code: "weak_password" });
      if(!resetVerified){ await cloud.verifyResetCode(email, code); resetVerified = true; }
      await cloud.setPassword(password); onSignedIn(await cloud.currentUser());
    }else if(authView === "account"){ await cloud.signOut(); cloudUser = null; renderCloudState(); closeAuth(); }   // 本机的学习记录不动
  }catch(e){
    if(e.code === "email_not_confirmed"){ showAuthView("verify", "这个邮箱还没验证,验证码已重发到 " + email); resendCode(); }
    else $("authError").textContent = authErrorText(e);
  }finally{ btn.disabled = false; }
}
async function resendCode(){
  const email = $("authEmail").value.trim();
  try{ await cloud.resendSignupCode(email); $("authHint").textContent = "验证码已重发到 " + email; }
  catch(e){ $("authError").textContent = authErrorText(e); }
}
function onSignedIn(user){ cloudUser = user; closeAuth(); renderCloudState(); requestSync(); }

/* ---------------- events ---------------- */
el.play.addEventListener("click", toggle);
el.reset.addEventListener("click", reset);
el.gear.addEventListener("click", openSettings);
el.overlay.addEventListener("click", e => { if(e.target === el.overlay) closeSettings(); });
$("closeSettings").addEventListener("click", closeSettings);
$("openStats").addEventListener("click", openStats);
$("closeStats").addEventListener("click", closeStats);
$("openCloud").addEventListener("click", openAuth);
$("closeAuth").addEventListener("click", closeAuth);
$("authSubmit").addEventListener("click", submitAuth);
$("authOverlay").addEventListener("click", e => { if(e.target === $("authOverlay")) closeAuth(); });
$("authOverlay").addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName === "INPUT") submitAuth(); });
window.addEventListener("online", requestSync);
el.stats.addEventListener("click", e => { if(e.target === el.stats) closeStats(); });
$("heatGrid").addEventListener("mouseover", e => { if(e.target.dataset && e.target.dataset.tip) showTip(e.target); });
$("heatGrid").addEventListener("mouseout", hideTip);
$("heatScroll").addEventListener("scroll", hideTip);
new ResizeObserver(() => { if(el.stats.classList.contains("open") && futureWeeks() !== heatFuture) renderHeatmap(); }).observe($("heatScroll"));   // 窗口变大变小、横竖屏切换:重算未来几列,今天仍在 4/5
$("saveSettings").addEventListener("click", () => { readSettings(); closeSettings(); });
$("testCash").addEventListener("click", () => { ensureLiveAudio(); unlockAudio(); if(master) master.gain.value = parseFloat(sEl.volume.value); playCash(); });
$("testBell").addEventListener("click", () => { ensureLiveAudio(); unlockAudio(); if(master) master.gain.value = parseFloat(sEl.volume.value); playBell(); });
$("volume").addEventListener("input", () => { if(master) master.gain.value = parseFloat(sEl.volume.value); });

document.addEventListener("visibilitychange", () => {
  checkRisk();
  if(document.visibilityState === "hidden"){ noteHidden(); saveSession(); return; }            // 进入后台:存档;不在计时就记下「可能被冻」
  if(st.running && audioCtx && audioCtx.state !== "running"){ wakeAudio().catch(()=>{}); }     // 回前台:计时中才唤醒;不计时让输出关着
  if(st.running) tick();
  requestSync();                                                                               // 回前台:补传没传上的、拉别的设备上的新记录
});
window.addEventListener("pageshow", () => {                       // 覆盖 BFCache/PWA 恢复
  if(st.running && audioCtx && audioCtx.state !== "running"){ wakeAudio().catch(()=>{}); }
});
window.addEventListener("pagehide", () => { saveSession(); });
document.addEventListener("keydown", e => {
  if(el.overlay.classList.contains("open") || el.stats.classList.contains("open")) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
});

/* ---------------- init ---------------- */
initAudio();          // 提前建好(挂起)音频上下文并解码,首次点击即可发声
quietAudio();         // 不计时:输出关着,点开始时再在手势内打开
noteHidden();         // 一打开就在后台(看不见):可能马上被冻,点开始时换新引擎
const _saved = loadSession();
if(_saved){ st = _saved.st; autoPaused = !!_saved.autoPaused; st.running = false; logFocus(_saved.savedAt); }  // 还原上次进度为「暂停」态(刷新后不丢 26/40);计时中直接关掉 app 的那段补记上
if(!Array.isArray(st.rings)) st.rings = planRings(st.totalMs, st.totalMs - st.remainingMs);   // 旧版存档没有 rings:从当前进度往后重新排
applyAccent();
render();
renderCloudState();
requestSync();        // 已登录就把没传的传上去、把云端的拉下来
</script>
</body>
</html>
